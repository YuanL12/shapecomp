[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "shapecomp"
version = "0.1.0"
description = "C++ and Python tools for comparing shapes and surfaces"
authors = [{name = "Yuan Luo", email = "luoyuan9809@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["numpy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]


[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
minimum-version = "build-system.requires"
build-dir = "build"
cmake.args = [
  "-G", "Ninja",
  "-DTF_BUILD_TESTS=OFF",
  "-DTF_BUILD_EXAMPLES=OFF",
  "-DSUITESPARSE=OFF",
  "-DSHAPECOMP_BUILD_TESTS=OFF",
  "-DSHAPECOMP_BUILD_EXAMPLES=OFF",
]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
filterwarnings = [
  "error",
  "ignore::pytest.PytestCacheWarning",
]
testpaths = ["tests"]


[tool.cibuildwheel]
build-frontend = "build[uv]"
test-command = "pytest {project}/tests"
test-extras = ["test"]

[tool.cibuildwheel.pyodide]
build-frontend = {name = "build", args = ["--exports", "whole_archive"]}

[tool.ruff.lint]
extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "NPY",         # NumPy specific rules
  "PD",          # pandas-vet
  "ANN",         # Typing
]
ignore = [
  "B009",     # getattr
  "PLR09",    # Too many X
  "PLR2004",  # Magic comparison
  "EM102",    # fstring 
  "EM101",    # fstring 
  "T201",     # print
  "I002",     # sys
  "I001",     # sort import
  "RET505",   # elif-return
  "ANN101",   # Typing  
  "ANN102",
  "ANN401",   # Typing.Any
  "PLC0415",  # import at the top
  "UP006", 
  "UP035",
  "UP045",
  "F541",     # fstring ignore abscence of placeholder  
  "C408",     # dict
  "E731",
]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
